# rustls-acme 0.15.4 with its crypto on graviola and RustCrypto's P-256 instead of
# ring or aws-lc-rs, so moq-relay compiles no C. Upstream requires one of those two
# (lib.rs: "Can we use something like CryptoProvider for rustls ... to drop this
# requirement?"). Carried changes: the `graviola` crypto shim, rcgen 0.14 with a
# P-256 key from the shim, and TestCache dropped (it generated keys through rcgen).
[package]
name = "rustls-acme"
version = "0.15.4"
authors = ["Florian Uekermann <florian@uekermann.me>"]
edition = "2018"
description = "TLS certificate management and serving using rustls"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/FlorianUekermann/rustls-acme"
publish = false

[dependencies]
futures-rustls = { version = "0.26", default-features = false }
futures = "0.3.21"
graviola = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
rustls-graviola = "0.4"
serde_json = "1.0.81"
serde = { version = "1.0.137", features = ["derive"] }
base64 = "0.22"
log = "0.4.17"
p256 = { version = "0.14", features = ["getrandom"] }
webpki-roots = { version = "1", optional = true }
pem = "3.0.3"
thiserror = "2"
x509-parser = ">=0.16, <0.19"
chrono = { version = "0.4.24", default-features = false, features = ["clock"] }
async-trait = "0.1.53"
async-io = "2.3.0"
tokio = { version = "1.20.1", optional = true }
tokio-util = { version = "0.7.3", features = ["compat"], optional = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"], optional = true }
async-web-client = { version = "0.6.3", default-features = false }
http = "1"
blocking = "1.4.1"
tower-service = { version = "0.3.3", optional = true }

[features]
default = ["tls12", "webpki-roots"]
axum = ["dep:axum-server", "tower"]
tower = ["dep:tower-service", "tokio"]
tokio = ["dep:tokio", "dep:tokio-util"]
tls12 = ["async-web-client/tls12"]
webpki-roots = ["dep:webpki-roots"]
